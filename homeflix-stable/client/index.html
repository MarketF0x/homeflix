<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Homeflix</title>
  </head>
  <body>
  <!-- Barre de titre overlay pour fenêtre frameless (Windows/Linux) -->
  <div id="hf-hotzone" class="hf-hotzone" aria-hidden="true"></div>
    <div id="hf-titlebar" class="hf-titlebar" aria-hidden="true">
      <div class="hf-titlebar-left">
        <div class="hf-app-title">Homeflix</div>
        <div class="hf-menu">
          <button class="hf-menu-item" data-action="reload" title="Actualiser (Ctrl+R)">Fichier</button>
          <button class="hf-menu-item" data-action="zoom-reset" title="Réinitialiser le zoom (Ctrl+0)">Affichage</button>
          <button class="hf-menu-item" data-action="help" title="Guide local">Aide</button>
        </div>
      </div>
      <div class="hf-titlebar-right">
        <button class="hf-win-btn" data-win="min" aria-label="Minimiser">—</button>
        <button class="hf-win-btn" data-win="max" aria-label="Maximiser">▢</button>
        <button class="hf-win-btn close" data-win="close" aria-label="Fermer">✕</button>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <style>
      html, body { margin: 0; }
      .hf-titlebar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 40px;
        display: flex; align-items: center; justify-content: space-between;
        background: linear-gradient(180deg, rgba(15,15,20,0.92) 0%, rgba(15,15,20,0.80) 100%);
        color: #eaeaea;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        z-index: 2147483647;
        opacity: 0; pointer-events: none; transition: opacity .18s ease;
        -webkit-app-region: drag; /* Permet de déplacer la fenêtre */
      }
      .hf-titlebar.visible { opacity: 1; pointer-events: auto; }
      .hf-titlebar-left { display: flex; align-items: center; gap: 12px; padding-left: 12px; }
      .hf-app-title { font-weight: 600; font-size: 14px; opacity: .9; }
      .hf-menu { display: flex; gap: 8px; -webkit-app-region: no-drag; }
      .hf-menu-item { background: transparent; color: #eaeaea; border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
      .hf-menu-item:hover { background: rgba(255,255,255,0.08); }
      .hf-titlebar-right { display: flex; -webkit-app-region: no-drag; }
      .hf-win-btn { width: 46px; height: 40px; background: transparent; color: #eaeaea; border: 0; cursor: pointer; }
      .hf-win-btn:hover { background: rgba(255,255,255,0.08); }
      .hf-win-btn.close:hover { background: #d9534f; color: #fff; }
      @media (max-width: 768px){ .hf-menu { display: none; } }
      /* Réserver un padding-top pour éviter que le contenu passe sous la barre quand visible */
      body.with-hf-titlebar-padding { padding-top: 40px; }

      /* Hotzone de survol en haut pour déclencher l'affichage de la barre */
      .hf-hotzone {
        position: fixed; top: 0; left: 0; right: 0; height: 36px; /* zone encore agrandie pour déclenchement plus facile */
        z-index: 2147483646; background: transparent; pointer-events: auto;
        -webkit-app-region: no-drag;
      }
    </style>

    <script>
      // Overlay titre+menu pour fenêtre frameless, affiché au survol du haut
      (function(){
        // Ne s'active QUE sur Electron
        const isElectron = navigator.userAgent.toLowerCase().includes('electron');
        if (!isElectron) return;
        
        const api = (window.homeflix || {});
        const bar = document.getElementById('hf-titlebar');
        const zone = document.getElementById('hf-hotzone');
        if (!bar || !zone) return;

  let hideTimer = null; let lastShowAt = 0; let lastVisible = false;
  const SHOW_DEBOUNCE_MS = 30; const HIDE_DELAY_MS = 2000; const HOVER_ZONE_PX = 36; // délai ajusté à 2s, zone étendue
  let lastPointerY = 9999; let lastMoveTs = 0;

        function setBarVisible(next){
          if (lastVisible === next) return;
          lastVisible = next;
          if (next) { bar.classList.add('visible'); document.body.classList.add('with-hf-titlebar-padding'); }
          else { bar.classList.remove('visible'); document.body.classList.remove('with-hf-titlebar-padding'); }
        }

        function scheduleHide(){
          if (hideTimer) clearTimeout(hideTimer);
          hideTimer = setTimeout(()=> setBarVisible(false), HIDE_DELAY_MS);
        }

        // Déclencheur fiable: hotzone en haut de fenêtre
        zone.addEventListener('mouseenter', ()=>{
          const now = Date.now();
          if (now - lastShowAt > SHOW_DEBOUNCE_MS){ setBarVisible(true); lastShowAt = now; }
          scheduleHide();
        });
        zone.addEventListener('mousemove', ()=>{ scheduleHide(); });
        zone.addEventListener('mouseleave', ()=>{ scheduleHide(); });

        // Fallback: détection directe au niveau fenêtre
        window.addEventListener('pointermove', (e)=>{
          const y = e.clientY;
          const now = Date.now();
          // Détection directe si la souris est dans la zone
          if (y <= HOVER_ZONE_PX){
            if (now - lastShowAt > SHOW_DEBOUNCE_MS){ setBarVisible(true); lastShowAt = now; }
            scheduleHide();
          } else {
            // Si mouvement rapide vers le bas depuis zone très haute (<6px) on affiche quand même
            if (lastPointerY < 6 && y < HOVER_ZONE_PX + 20 && now - lastMoveTs < 120){
              if (now - lastShowAt > SHOW_DEBOUNCE_MS){ setBarVisible(true); lastShowAt = now; }
              scheduleHide();
            }
          }
          lastPointerY = y; lastMoveTs = now;
        }, { passive: true });

        // Tant que la barre est survolée, ne pas la replier
        bar.addEventListener('mouseenter', ()=>{ if (hideTimer) clearTimeout(hideTimer); });
        bar.addEventListener('mouseleave', ()=>{ scheduleHide(); });

        window.addEventListener('blur', ()=>{ scheduleHide(); });

        // Raccourci: appuyer sur Alt affiche la barre temporairement
        window.addEventListener('keydown', (e)=>{
          if (e && e.altKey) { setBarVisible(true); scheduleHide(); }
        });

        // Boutons fenêtre et actions
        bar.addEventListener('click', (e)=>{
          const t = e.target;
          if (!(t instanceof Element)) return;
          const win = t.getAttribute('data-win');
          if (win === 'min') return api.winMinimize && api.winMinimize();
          if (win === 'max') return api.winToggleMaximize && api.winToggleMaximize();
          if (win === 'close') return api.winClose && api.winClose();

          const act = t.getAttribute('data-action');
          if (act === 'reload') return api.viewReload && api.viewReload();
          if (act === 'zoom-reset') return api.viewZoomReset && api.viewZoomReset();
          if (act === 'help') return api.helpOpen && api.helpOpen();
        });
      })();
    </script>
  </body>
</html>
